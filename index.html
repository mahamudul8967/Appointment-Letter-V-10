<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Letter Generator - Friends Knittings Ltd.</title>
    <!-- SheetJS for Excel Reading -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 30px; margin: 0; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #003366; margin-top: 0; font-size: 24px; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #003366; padding: 25px; text-align: center; border-radius: 8px; background: #f0f4f8; margin-bottom: 25px; }
        .upload-area input { display: none; }
        .upload-btn { background: #003366; color: white; padding: 12px 24px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .upload-btn:hover { background: #002244; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #003366; color: white; }
        .btn-download { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-download:hover { background: #218838; }
        .btn-bulk { background: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-bulk:hover { background: #0056b3; }
        .instructions { font-size: 13px; color: #333; background: #eef6ff; border-left: 4px solid #003366; padding: 12px; margin-bottom: 20px; line-height: 1.5; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Friends Knittings Ltd.</h1>
    <p class="subtitle">Bulk Appointment Letter Generator</p>

    <div class="instructions">
        <strong>Updated Layout:</strong><br>
        Changed to "Dear, [Name]" format.
    </div>

    <div class="upload-area">
        <label for="excelFile" class="upload-btn">📁 Choose Employee Excel File</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        <p id="fileName" style="margin-top: 10px; font-weight: bold; color: #333;"></p>
    </div>

    <div id="dataList" style="display:none;">
        <div class="action-bar">
            <h3>Uploaded Employee List</h3>
            <button class="btn-bulk" onclick="downloadCombinedWordDoc()">📄 Download All in One Word Doc</button>
        </div>
        <table id="empTable">
            <thead>
                <tr>
                    <th>SL</th>
                    <th>Emp Code</th>
                    <th>Name</th>
                    <th>Designation</th>
                    <th>Department</th>
                    <th>DOJ (Joining Date)</th>
                    <th>Gross Salary</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
let employeeData = [];

document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('fileName').innerText = "Loaded File: " + file.name;
    const reader = new FileReader();

    reader.onload = function(event) {
        const data = new Uint8Array(event.target.result);
        
        const workbook = XLSX.read(data, { type: 'array', cellDates: false, raw: true });
        const firstSheet = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheet];
        
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        
        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(15, rows.length); i++) {
            const rowStr = rows[i].map(c => String(c).toLowerCase().replace(/\s+/g, '')).join(' ');
            if (rowStr.includes('empcode') || rowStr.includes('doj') || rowStr.includes('designation')) {
                headerRowIndex = i;
                break;
            }
        }

        const headers = rows[headerRowIndex].map(h => String(h).trim());
        employeeData = [];

        for (let i = headerRowIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;
            
            let obj = {};
            let hasValue = false;
            headers.forEach((h, colIdx) => {
                let val = row[colIdx];
                if (val !== undefined && val !== null && val !== "") {
                    hasValue = true;
                }
                let cleanKey = h.replace(/[\r\n]+/g, " ").trim();
                obj[cleanKey] = val;
            });

            if (hasValue && (obj['Name'] || obj['Emp Code'] || obj['SL'])) {
                employeeData.push(obj);
            }
        }

        renderTable();
    };

    reader.readAsArrayBuffer(file);
});

function getFieldValue(emp, possibleKeys, defaultValue = '') {
    for (let key of possibleKeys) {
        for (let empKey in emp) {
            let k1 = empKey.toLowerCase().replace(/[^a-z0-9]/g, '');
            let k2 = key.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (k1 === k2 && emp[empKey] !== undefined && emp[empKey] !== null && emp[empKey] !== "") {
                return emp[empKey];
            }
        }
    }
    return defaultValue;
}

function parseAndFormatDate(rawDate) {
    if (!rawDate) return '';

    if (typeof rawDate === 'number' || (!isNaN(rawDate) && !String(rawDate).includes('-') && !String(rawDate).includes('/'))) {
        let num = Number(rawDate);
        let utc_days  = Math.floor(num - 25569);
        let utc_value = utc_days * 86400;                                             
        let date_info = new Date(utc_value * 1000);
        
        let monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let day = String(date_info.getUTCDate()).padStart(2, '0');
        let month = monthNames[date_info.getUTCMonth()];
        let year = date_info.getUTCFullYear();
        return `${day} ${month}, ${year}`;
    }

    let strDate = String(rawDate).trim().split(' ')[0];
    
    if (strDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
        let parts = strDate.split('-');
        let year = parts[0];
        let monthIdx = parseInt(parts[1], 10) - 1;
        let day = parts[2];
        let monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        return `${day} ${monthNames[monthIdx]}, ${year}`;
    }

    if (strDate.match(/^\d{1,2}[\/-]\d{1,2}[\/-]\d{4}$/)) {
        let parts = strDate.split(/[\/-]/);
        let day = parts[0].padStart(2, '0');
        let monthIdx = parseInt(parts[1], 10) - 1;
        let year = parts[2];
        let monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        return `${day} ${monthNames[monthIdx]}, ${year}`;
    }

    return String(rawDate).trim();
}

function getJoiningDate(emp) {
    let rawDate = getFieldValue(emp, ['DOJ', 'Date of Joining', 'Joining Date']);
    return parseAndFormatDate(rawDate);
}

function formatAddress(emp) {
    let village = String(getFieldValue(emp, ['Permanent Village', 'Village'])).trim();
    let postOffice = String(getFieldValue(emp, ['Permanent Post Office', 'Post Office'])).trim();
    let thana = String(getFieldValue(emp, ['Permanent Thana', 'Thana', 'P.S'])).trim();
    let district = String(getFieldValue(emp, ['Permanent District', 'District', 'Dist'])).trim();

    let parts = [];
    if (village) parts.push(`Vill: ${village}`);
    if (postOffice) parts.push(`P.O: ${postOffice}`);
    if (thana) parts.push(`P.S: ${thana}`);
    if (district) parts.push(`Dist: ${district}`);

    if (parts.length > 0) {
        return parts.join(', ');
    }

    return String(getFieldValue(emp, ['Permanent Address', 'Address'], 'N/A')).trim();
}

function renderTable() {
    const tbody = document.querySelector('#empTable tbody');
    tbody.innerHTML = '';

    employeeData.forEach((emp, index) => {
        const empCode = getFieldValue(emp, ['Emp Code', 'Code', 'SL'], index + 1);
        const name = getFieldValue(emp, ['Name', 'Emp Name'], 'N/A');
        const designation = getFieldValue(emp, ['Designation'], 'N/A');
        const department = getFieldValue(emp, ['Department', 'Section', 'Sub Section'], 'N/A');
        const doj = getJoiningDate(emp);
        const gross = getFieldValue(emp, ['Gross', 'Salary', 'Gross Salary'], 0);

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${empCode}</td>
            <td><strong>${name}</strong></td>
            <td>${designation}</td>
            <td><strong>${department}</strong></td>
            <td><strong>${doj}</strong></td>
            <td><strong>BDT ${Number(gross).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</strong></td>
            <td><button class="btn-download" onclick="downloadSingleWordDoc(${index})">📥 Single Word Doc</button></td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('dataList').style.display = 'block';
}

function convertNumberToWords(amount) {
    const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    let num = Math.floor(parseFloat(amount));
    if (isNaN(num) || num === 0) return 'Zero taka only';

    function inWords(n) {
        if ((n = n.toString()).length > 9) return 'overflow';
        let n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_array) return ''; 
        let str = '';
        str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'Crore ' : '';
        str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'Lakh ' : '';
        str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'Thousand ' : '';
        str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'Hundred ' : '';
        str += (n_array[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
        return str.trim();
    }

    let words = inWords(num);
    return words ? words.charAt(0).toUpperCase() + words.slice(1) + ' taka only' : 'Zero taka only';
}

function calculateBreakup(grossSalary) {
    const total = parseFloat(grossSalary) || 0;
    const basic = total * 0.55;
    const houseRent = basic * 0.50;
    const medical = total * 0.125;
    const transport = Math.max(0, total - (basic + houseRent + medical));
    
    const formatNum = (num) => num.toLocaleString('en-IN', { 
        minimumFractionDigits: 2, 
        maximumFractionDigits: 2 
    });

    return {
        basic: formatNum(basic),
        houseRent: formatNum(houseRent),
        medical: formatNum(medical),
        transport: formatNum(transport),
        total: formatNum(total)
    };
}

// Generates individual letter content
function generateEmployeeLetterBody(index) {
    const emp = employeeData[index];
    const empCode = getFieldValue(emp, ['Emp Code', 'Code'], index + 1);
    const ref = `FKL/HR/Appointment letter/2026/${empCode}`;
    const joiningDate = getJoiningDate(emp);
    const headerDate = joiningDate; 

    const name = String(getFieldValue(emp, ['Name', 'Emp Name'], '')).trim();
    const father = String(getFieldValue(emp, ['Father Name', 'FatherName'], '')).trim();
    const mother = String(getFieldValue(emp, ['MotherName', 'Mother Name'], '')).trim();
    const address = formatAddress(emp);
    const designation = String(getFieldValue(emp, ['Designation'], 'Executive')).trim();
    const department = String(getFieldValue(emp, ['Department', 'Section', 'Sub Section'], 'Production')).trim();
    const reporting = String(getFieldValue(emp, ['Reporting Manager'], 'Head of Department')).trim();
    
    const grossAmount = getFieldValue(emp, ['Gross', 'Salary', 'Gross Salary'], 0);
    const salary = calculateBreakup(grossAmount);
    const salaryInWords = convertNumberToWords(grossAmount);

    return `
        <div>
            <table class="header-table">
                <tr>
                    <td width="50%" align="left"><strong>Ref: ${ref}</strong></td>
                    <td width="50%" align="right" class="right-align"><strong>Date: ${headerDate}</strong></td>
                </tr>
            </table>

            <div class="title">Letter of Appointment</div>

            <div class="recipient-block">
                <p><strong>To,</strong></p>
                <p>${name}</p>
                <p>Father’s Name: ${father}</p>
                <p>Mother’s Name: ${mother}</p>
                <p>Address: ${address}</p>
            </div>

            <p style="margin-top: 4px; text-align: left;"><strong>Dear, ${name}</strong></p>

            <p>This has reference to your application for a job with the company and the subsequent interview we had in this regard. The management is pleased to set out the terms of your employment with <strong>Friends Knittings Ltd.</strong> called the “company” as detail below:</p>

            <p><strong>1. Job title:</strong> You will be designated as <strong>“${designation}”</strong> Under the <strong>${department}</strong> Department.</p>
            <p><strong>2. Joining:</strong> You joining in this company on or before <strong>${joiningDate}</strong>.</p>
            <p><strong>3. Probation period:</strong> You will be on probation for a period of 06 (Six) months. Based on your performance, your appointment may be confirmed, or the probation period may be extended further if your performance is not satisfactory. During the probation period, your service may be terminated at any time without any prior notice whatsoever. After successfully complete the probation period, if you do not receive any further extension notice, your job will be confirmed automatically.</p>
            <p><strong>4. Remuneration:</strong> You will receive a gross salary of <strong>BDT ${salary.total}/- (${salaryInWords})</strong> per month and your gross salary break up as below:</p>

            <table class="salary-table" align="center">
                <thead>
                    <tr>
                        <th width="20%">S/L NO</th>
                        <th width="50%">Subject</th>
                        <th width="30%" align="right" class="right-align">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="center-align">1</td>
                        <td>Basic</td>
                        <td class="right-align">${salary.basic}</td>
                    </tr>
                    <tr>
                        <td class="center-align">2</td>
                        <td>House Rent</td>
                        <td class="right-align">${salary.houseRent}</td>
                    </tr>
                    <tr>
                        <td class="center-align">3</td>
                        <td>Medical Allowance</td>
                        <td class="right-align">${salary.medical}</td>
                    </tr>
                    <tr>
                        <td class="center-align">4</td>
                        <td>Transport</td>
                        <td class="right-align">${salary.transport}</td>
                    </tr>
                    <tr>
                        <td colspan="2" class="center-align"><strong>Grand Total</strong></td>
                        <td class="right-align"><strong>${salary.total}</strong></td>
                    </tr>
                </tbody>
            </table>

            <p><strong>5. Tax:</strong> Income tax on salary will be deducted from your salary as per the applicable law of the country.</p>
            <p><strong>6. Notice Period:</strong> At least 60 (Sixty) days’ notices in written must be given, if you desire to discontinue your employment with the company at any time or pay 60 (Sixty) day’s wages to the employer in lieu of the notice period.</p>
            <p><strong>7. Duties:</strong> You will observe the normal attendance of hours of the company applicable to the location of your posting. You will devote your whole time and attention to the business of the company, obey and observe all lawful instructions given to you and generally use your best endeavors to promote the interest of the company.</p>
            <p><strong>8. Transfer:</strong> The Authority has the right to place you in any department or institution within the organisation and can transfer you to any relevant facility as needed.</p>
            <p><strong>9. Restrictions:</strong> During your employment with the company, you will not engage yourself in any business that conflicts with the interest of the company.</p>
            <p><strong>10. Confidentiality:</strong> During your employment, you will not divulge to any person or persons any secret or confidential knowledge or information which you may have acquired as a result of your employment with the company. If you disclose any such information to any other person, the company may take legal action if deemed appropriate to protect or enforce its rights against you and /or such other person.</p>
            <p><strong>11. Posting:</strong> Your initial posting will be at <strong>Friends Knittings Ltd.</strong> located at 1406/1 Deshipara Road, South Salna, Gazipur-1703. But the management reserves the right to relocate you to any other place if necessary.</p>
            <p><strong>12. Working Hour and Leave:</strong> Your working hours are determined by your responsibilities and as per company’s standard working hour policy. You will be allowed to enjoy the leave as per company leave policy.</p>
            <p><strong>13. Return of Company Property:</strong> You will upon termination of your employment, deliver to the company all properties, which may be in your possession including all facilities, materials and all documents.</p>
            <p><strong>14. Disciplinary Action:</strong> If you are in breach of this agreement or are found guilty of misconduct, the company will take appropriate disciplinary action as per applicable law of the Country.</p>
            <p><strong>15. Governing Law:</strong> Your services shall be governed by the prevailing laws in force as well as the rules and regulations of the company as may be applicable from time to time.</p>
            <p><strong>16. Reporting:</strong> You are advised to report for your duties to the <strong>${reporting}</strong> who will provide you with K.P.I. based job description.</p>
            <p><strong>17. Document Submission:</strong> Please sign and return to us a copy of this appointment letter duly accepted by you and let us know the tentative date of your joining. On or before joining please submit the following to the Human Resource Department:</p>

            <ul>
                <li>04 copies of passport size photograph & National ID /Birth certificate.</li>
                <li>Photocopies of certificate /mark sheets in support of academic qualifications.</li>
                <li>Photocopy of the releasing letter of the previous organization.</li>
                <li>Salary certificate in Proof of last salary drawn.</li>
                <li>Certificate/statement of the deduction of income tax.</li>
            </ul>

            <p>Should you agree with the above terms and conditions set herein, please sign and return to us the duplicate copy of this appointment letter as expression of your acceptance of the offer.</p>
            <p>We welcome you to the Debonair family as look forward to a long-term association with you.</p>

            <p style="margin-top: 10px; text-align: left;">Thanking,</p>

            <div class="sig-area">
                ------------------------------------------<br>
                <strong>Md. Mostofa Kamil </strong><br>
                <strong>GM</strong>- HR, Compliance & EMS<br>
                Friends Knittings Ltd.
            </div>

            <p class="declaration-text">I have read and understood this letter of employment and I willingly agree to accept the terms and conditions, as offered and would like to join.</p>

            <div style="margin-top: 15px; font-size: 11pt; white-space: nowrap;">
                Received by............................................................................................................................................
            </div>

            <div style="margin-top: 8px; font-size: 11pt; white-space: nowrap;">
                Signature of the applicant..................................................Date:...........................................................
            </div>
        </div>
    `;
}

function getWordDocumentWrapper(content) {
    return `
    <html xmlns:o='urn:schemas-microsoft-com:office:office'
          xmlns:w='urn:schemas-microsoft-com:office:word'
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head>
        <meta charset='utf-8'>
        <title>Letter of Appointment</title>

        <xml>
            <w:WordDocument>
                <w:View>Print</w:View>

            }

            .recipient-block { text-align: left; margin-bottom: 8px; line-height: 1.2; }
            .recipient-block p { text-align: left; margin: 1px 0; font-size: 11pt; }
            
            .salary-table { 
                border-collapse: collapse; 
                width: 65%; 
                margin-top: 4px; 
                margin-bottom: 4px; 
                margin-left: auto; 
                margin-right: auto; 
            }
            .salary-table, .salary-table th, .salary-table td { border: 1px solid #000; }
            .salary-table th { font-weight: bold; text-align: left; padding: 2px 5px; font-size: 10.5pt; }

    `;
}

// Download Single Word Document
function downloadSingleWordDoc(index) {
    const emp = employeeData[index];
    const empCode = getFieldValue(emp, ['Emp Code', 'Code'], index + 1);
    const name = String(getFieldValue(emp, ['Name', 'Emp Name'], 'Employee')).trim();
    
    const letterHtml = generateEmployeeLetterBody(index);
    const fullHtml = getWordDocumentWrapper(letterHtml);

    const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = `Appointment_Letter_${empCode}_${name.replace(/[^a-zA-Z0-9]/g, '_')}.doc`;
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}

// Download ALL Employees in ONE Single Word Document
function downloadCombinedWordDoc() {
    if (employeeData.length === 0) {
        alert("No employee data available to download.");
        return;
    }

    let combinedHtmlContent = "";
    const totalCount = employeeData.length;

    employeeData.forEach((emp, index) => {
        combinedHtmlContent += generateEmployeeLetterBody(index);
        
        if (index < totalCount - 1) {
            combinedHtmlContent += `<p class="word-page-break">&nbsp;</p>`;
        }
    });

    const fullHtml = getWordDocumentWrapper(combinedHtmlContent);
    const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
    
    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = "All_Appointment_Letters_Combined.doc";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
</script>
